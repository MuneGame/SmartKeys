# ==============================================================================
#  SmartKeys (MIWN) — compila, prueba y empaqueta los instaladores en la nube
#  (GitHub Actions)
#
#  macOS  : SmartKeys-<versión>-macOS.pkg          (Universal: Apple Silicon + Intel;
#                                                    SmartKeys VST3 + AU + Standalone)
#  Windows: SmartKeys-<versión>-Windows-Setup.exe  (SmartKeys VST3 + Standalone)
#
#  En cada máquina de pruebas se simula una versión ANTERIOR instalada (también
#  la vieja SmartKeys FX) y se comprueba que el instalador nuevo la borra antes
#  de instalar. Después se validan los plugins instalados (auval de Apple +
#  pluginval nivel 10, con las pruebas de editor: abrir y cerrar la ventana).
#
#  Micrófono del sistema (macOS): en otra Mac Intel se instala BlackHole (un
#  cable de audio virtual), se reproduce un La3 de 220 Hz y se comprueba con el
#  código real de CoreAudio que MIC VOICE lo lee SIN sidechain y sin cambiar la
#  frecuencia ni el búfer del dispositivo.
#
#  Se ejecuta en cada push a main o manualmente desde la pestaña "Actions".
#  Los instaladores se publican en la Release v<versión> y en la rama "installers".
# ==============================================================================
name: Build installers

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

env:
  SK_VERSION: "1.5.0"

jobs:
  macos:
    name: macOS (.pkg)
    # Mac Intel (como el MacBook Air de las pruebas en FL Studio); compila el binario Universal
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Herramientas
        run: |
          sw_vers
          xcodebuild -version
          cmake --version
          brew install ninja || true

      - name: Compilar (Universal) y generar el .pkg
        run: |
          chmod +x Installer/build_mac_installer.sh
          set -o pipefail
          ./Installer/build_mac_installer.sh 2>&1 | tee "$RUNNER_TEMP/build-mac.log"

      - name: Subir el instalador
        uses: actions/upload-artifact@v4
        with:
          name: SmartKeys-macOS-pkg
          path: Installer/Output/*.pkg
          if-no-files-found: error

      - name: El .pkg lleva los scripts de limpieza
        run: |
          pkgutil --expand-full Installer/Output/SmartKeys-$SK_VERSION-macOS.pkg "$RUNNER_TEMP/pkgx"
          for c in vst3 au app; do
            ls -la "$RUNNER_TEMP/pkgx/$c.pkg/Scripts"
            test -x "$RUNNER_TEMP/pkgx/$c.pkg/Scripts/preinstall"
            test -f "$RUNNER_TEMP/pkgx/$c.pkg/Scripts/cleanup_common.sh"
          done
          test -x "$RUNNER_TEMP/pkgx/au.pkg/Scripts/postinstall"

      - name: Simular una versión ANTERIOR instalada (global y en ~/Library, con SmartKeys FX)
        run: |
          for d in "/Library/Audio/Plug-Ins/VST3/SmartKeys.vst3" "/Library/Audio/Plug-Ins/VST3/SmartKeys FX.vst3" \
                   "/Library/Audio/Plug-Ins/Components/SmartKeys.component" "/Library/Audio/Plug-Ins/Components/SmartKeys FX.component" \
                   "/Applications/SmartKeys.app"; do
            sudo mkdir -p "$d/Contents" && sudo touch "$d/Contents/OLD_VERSION"
          done
          for d in "$HOME/Library/Audio/Plug-Ins/VST3/SmartKeys.vst3" "$HOME/Library/Audio/Plug-Ins/Components/SmartKeys FX.component"; do
            mkdir -p "$d/Contents" && touch "$d/Contents/OLD_VERSION"
          done
          FL="$HOME/Documents/Image-Line/FL Studio/Presets/Plugin database/Installed/Generators/VST3"
          mkdir -p "$FL" && touch "$FL/SmartKeys.nfo" "$FL/OtroPlugin.nfo"
          sudo mkdir -p "/Library/Audio/Plug-Ins/VST3/OtroPlugin.vst3"
          find /Library/Audio/Plug-Ins "$HOME/Library/Audio/Plug-Ins" /Applications -maxdepth 4 -name OLD_VERSION

      - name: Instalar el .pkg y comprobar que borró la versión anterior
        run: |
          sudo installer -pkg Installer/Output/SmartKeys-$SK_VERSION-macOS.pkg -target / -verboseR
          echo "--- registro de limpieza"; cat /tmp/smartkeys-install.log
          if find /Library/Audio/Plug-Ins "$HOME/Library/Audio/Plug-Ins" /Applications -maxdepth 4 -name OLD_VERSION | grep .; then
            echo "ERROR: quedaron archivos de la versión anterior"; exit 1
          fi
          test ! -e "$HOME/Library/Audio/Plug-Ins/VST3/SmartKeys.vst3"
          test ! -e "$HOME/Library/Audio/Plug-Ins/Components/SmartKeys FX.component"
          # Un único plugin: la vieja SmartKeys FX no vuelve a instalarse
          test ! -e "/Library/Audio/Plug-Ins/VST3/SmartKeys FX.vst3"
          test ! -e "/Library/Audio/Plug-Ins/Components/SmartKeys FX.component"
          FLDB="$HOME/Documents/Image-Line/FL Studio/Presets/Plugin database/Installed/Generators/VST3"
          # ~/Documents está protegido por TCC: si macOS no deja al instalador entrar, sólo se avisa
          if [ -e "$FLDB/SmartKeys.nfo" ]; then echo "AVISO: macOS no permitió borrar la ficha de FL Studio (TCC)"; else echo "Ficha de FL Studio borrada"; fi
          test -e "$FLDB/OtroPlugin.nfo"
          test -d "/Library/Audio/Plug-Ins/VST3/OtroPlugin.vst3"
          for b in "/Library/Audio/Plug-Ins/VST3/SmartKeys.vst3/Contents/MacOS/SmartKeys" \
                   "/Library/Audio/Plug-Ins/Components/SmartKeys.component/Contents/MacOS/SmartKeys" \
                   "/Applications/SmartKeys.app/Contents/MacOS/SmartKeys"; do
            lipo -info "$b"
            lipo "$b" -verify_arch arm64 x86_64
          done
          for b in "/Library/Audio/Plug-Ins/VST3/SmartKeys.vst3" "/Library/Audio/Plug-Ins/Components/SmartKeys.component" \
                   "/Applications/SmartKeys.app"; do
            codesign --verify --deep --strict --verbose=2 "$b"
            # Fabricante MIWN y permiso de micrófono declarado
            plutil -extract CFBundleIdentifier raw "$b/Contents/Info.plist" | grep -x "com.miwn.smartkeys"
            plutil -extract NSMicrophoneUsageDescription raw "$b/Contents/Info.plist"
          done
          plutil -extract NSHumanReadableCopyright raw "/Library/Audio/Plug-Ins/Components/SmartKeys.component/Contents/Info.plist" | grep MIWN
          plutil -p "/Library/Audio/Plug-Ins/Components/SmartKeys.component/Contents/Info.plist" | grep -i "MIWN: SmartKeys"

      - name: Validar los Audio Units (auval de Apple)
        run: |
          killall -9 AudioComponentRegistrar || true
          sleep 3
          auval -a | grep -i -e smartkeys -e Jpau || true
          auval -v aumu Smk1 Jpau
          # SmartKeys FX ya no existe
          if auval -a | grep -q Smkf; then echo "ERROR: sigue registrado SmartKeys FX"; exit 1; fi

      - name: Validar los VST3 (pluginval, nivel 10)
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          unzip -q pluginval.zip
          # Con las pruebas de editor: abrir y cerrar la ventana del plugin (el cierre de la 1.2–1.3)
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process \
            --timeout-ms 300000 --validate "/Library/Audio/Plug-Ins/VST3/SmartKeys.vst3"

      - name: Mostrar el registro de compilación (si algo falló)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LOG="$RUNNER_TEMP/build-mac.log"
          [ -f "$LOG" ] || echo "(sin registro)" > "$LOG"
          errs=$(grep -n -i -E "error|fatal|failed|No se encontr" "$LOG" | head -n 40 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          tailmsg=$(tail -n 60 "$LOG" | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Errores::$errs"
          echo "::error title=Final del registro::$tailmsg"
          mkdir -p "$RUNNER_TEMP/logs" && cp "$LOG" "$RUNNER_TEMP/logs/" && cd "$RUNNER_TEMP/logs"
          git init -q -b ci-logs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Registro de compilación macOS (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-logs || true

  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compilar (SmartKeys VST3 + Standalone)
        run: |
          cmake --version
          cmake -B build -A x64 -DSMARTKEYS_COPY_AFTER_BUILD=OFF
          cmake --build build --config Release --parallel

      - name: Generar el instalador .exe
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" Installer\Installer_Windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Subir el instalador
        uses: actions/upload-artifact@v4
        with:
          name: SmartKeys-Windows-exe
          path: Installer/Output/*.exe
          if-no-files-found: error

      - name: Simular una versión ANTERIOR, instalar y comprobar que se borró
        run: |
          $vst3 = "${env:CommonProgramFiles}\VST3"
          $old = @("$vst3\SmartKeys.vst3\Contents", "$vst3\SmartKeys FX.vst3\Contents",
                   "${env:LOCALAPPDATA}\Programs\Common\VST3\SmartKeys.vst3\Contents")
          foreach ($d in $old) { New-Item -ItemType Directory -Force -Path $d | Out-Null; Set-Content -Path "$d\OLD_VERSION" -Value "old" }
          $setup = (Resolve-Path "Installer\Output\SmartKeys-${env:SK_VERSION}-Windows-Setup.exe").Path
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-","/LOG=install.log" -Wait -PassThru
          Get-Content install.log | Select-String -Pattern "Deleting|InstallDelete|Dest filename" | Select-Object -First 40
          if ($p.ExitCode -ne 0) { Write-Error "El instalador terminó con código $($p.ExitCode)"; exit 1 }
          $left = Get-ChildItem -Recurse -Filter OLD_VERSION -Path "$vst3", "${env:LOCALAPPDATA}\Programs\Common\VST3" -ErrorAction SilentlyContinue
          if ($left) { $left | ForEach-Object { $_.FullName }; Write-Error "Quedaron archivos de la versión anterior"; exit 1 }
          foreach ($f in @("$vst3\SmartKeys.vst3\Contents\x86_64-win\SmartKeys.vst3",
                           "${env:ProgramFiles}\SmartKeys\SmartKeys.exe")) {
            if (-not (Test-Path $f)) { Write-Error "Falta $f"; exit 1 }
            Get-Item $f | Select-Object FullName, Length
          }
          # Un único plugin: SmartKeys FX se borró y no vuelve
          if (Test-Path "$vst3\SmartKeys FX.vst3") { Write-Error "Sigue instalado SmartKeys FX"; exit 1 }
          # Fabricante MIWN en el ejecutable
          $info = (Get-Item "$vst3\SmartKeys.vst3\Contents\x86_64-win\SmartKeys.vst3").VersionInfo
          $info | Format-List CompanyName, LegalCopyright, FileVersion
          if ($info.CompanyName -ne "MIWN") { Write-Error "El fabricante no es MIWN"; exit 1 }

      - name: Validar los VST3 instalados (pluginval, nivel 10)
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pv
          .\pv\pluginval.exe --strictness-level 10 --validate-in-process --timeout-ms 300000 --validate "${env:CommonProgramFiles}\VST3\SmartKeys.vst3"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  macos-mic:
    name: macOS — MIC VOICE sin sidechain (CoreAudio real)
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cable de audio virtual (BlackHole) como entrada y salida de macOS
        run: |
          brew install ninja switchaudio-osx || true
          brew install --cask blackhole-2ch
          sudo killall -9 coreaudiod || sudo launchctl kickstart -kp system/com.apple.audio.coreaudiod || true
          for i in $(seq 1 30); do SwitchAudioSource -a | grep -q "BlackHole 2ch" && break; sleep 1; done
          SwitchAudioSource -a
          SwitchAudioSource -t input  -s "BlackHole 2ch"
          SwitchAudioSource -t output -s "BlackHole 2ch"
          echo "entrada: $(SwitchAudioSource -c -t input)   salida: $(SwitchAudioSource -c -t output)"

      - name: Compilar el VST3, la sonda del micrófono y las pruebas (Intel)
        run: |
          cmake -S . -B build-mic -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=x86_64 \
                -DSMARTKEYS_BUILD_MIC_PROBE=ON -DSMARTKEYS_BUILD_HOST_TESTS=ON -DSMARTKEYS_BUILD_TESTS=ON
          cmake --build build-mic --target SmartKeys_VST3 SmartKeysMicProbe SmartKeysHostTests SmartKeysTests

      - name: Pruebas del núcleo
        run: ./build-mic/SmartKeysTests_artefacts/Release/SmartKeysTests | tail -n 5

      - name: Sonda — con el micrófono en silencio (nada cambia en el dispositivo)
        env:
          SMARTKEYS_ASSUME_MIC_PERMISSION: "1"
        run: |
          ./build-mic/SmartKeysMicProbe_artefacts/Release/SmartKeysMicProbe 3 | tee probe-silence.txt
          echo "::notice title=Sonda en silencio::$(tr '\n' ' ' < probe-silence.txt)"

      - name: Sonda — cantando La3 (220 Hz) por la entrada de macOS
        env:
          SMARTKEYS_ASSUME_MIC_PERMISSION: "1"
        run: |
          python3 - <<'PY'
          import math, struct, wave
          rate = 48000
          with wave.open("la3.wav", "wb") as w:
              w.setnchannels(2); w.setsampwidth(2); w.setframerate(rate)
              frames = bytearray()
              for i in range(rate * 90):
                  v = int(0.3 * 32767 * math.sin(2 * math.pi * 220.0 * i / rate))
                  frames += struct.pack("<hh", v, v)
              w.writeframes(bytes(frames))
          PY
          afplay la3.wav & echo $! > afplay.pid
          sleep 2
          set +e
          ./build-mic/SmartKeysMicProbe_artefacts/Release/SmartKeysMicProbe 4 --expect-hz 220 --require-audio | tee probe-a3.txt
          code=${PIPESTATUS[0]}
          echo "::notice title=Sonda con La3::$(tr '\n' ' ' < probe-a3.txt)"
          exit $code

      - name: SmartKeys (VST3) — MIC VOICE sin sidechain lee el micrófono del sistema
        env:
          SMARTKEYS_ASSUME_MIC_PERMISSION: "1"
        run: |
          kill -0 $(cat afplay.pid) 2>/dev/null || { afplay la3.wav & echo $! > afplay.pid; sleep 2; }
          set +e
          ./build-mic/SmartKeysHostTests_artefacts/Release/SmartKeysHostTests \
            build-mic/SmartKeys_artefacts/Release/VST3/SmartKeys.vst3 --system-mic-only | tee host-mic.txt
          code=${PIPESTATUS[0]}
          echo "::notice title=MIC VOICE en el VST3::$(grep -E 'ok|FALLO|comprobaciones|->' host-mic.txt | tr '\n' ' ')"
          kill $(cat afplay.pid) 2>/dev/null || true
          exit $code

  publish:
    name: Publicar instaladores
    needs: [ macos, windows, macos-mic ]
    # Sólo se publica desde main (las ramas de prueba compilan y prueban, nada más)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Descargar los instaladores de esta compilación
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release v${{ env.SK_VERSION }} (página de descargas del repositorio)
        run: |
          ls -la dist
          TAG="v$SK_VERSION"
          NOTES="Instaladores de SmartKeys $SK_VERSION (MIWN) compilados y probados automáticamente (commit ${GITHUB_SHA::7}).
          - macOS: SmartKeys-$SK_VERSION-macOS.pkg (Apple Silicon + Intel; VST3, AU y Standalone)
          - Windows: SmartKeys-$SK_VERSION-Windows-Setup.exe (VST3 y Standalone)
          Un único plugin de instrumento: MIC VOICE lee el micrófono de macOS sin sidechain.
          Ambos instaladores borran automáticamente cualquier versión anterior (y la vieja SmartKeys FX) antes de instalar."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --notes "$NOTES" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --title "SmartKeys $SK_VERSION" --notes "$NOTES" \
              --target "$GITHUB_SHA" --latest --repo "$GITHUB_REPOSITORY"
          fi

      - name: Rama "installers" con los archivos
        run: |
          mkdir publish && cp dist/* publish/
          cd publish
          git init -q -b installers
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Instaladores SmartKeys $SK_VERSION (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" installers
